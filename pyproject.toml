[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteboard-explainer"
dynamic = ["version"]
description = "Hand-drawn whiteboard explainer videos, timed word-by-word to a voiceover."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.0", "playwright>=1.40", "numpy", "pyyaml"]

[project.scripts]
wbx = "wbx.cli:main"

[tool.setuptools]
packages = ["wbx"]

[tool.setuptools.dynamic]
version = {attr = "wbx.__version__"}

[tool.setuptools.package-data]
wbx = ["runtime/*", "templates/*"]
