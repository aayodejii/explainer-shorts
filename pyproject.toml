[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explainer-shorts"
dynamic = ["version"]
description = "Turn a voiceover into an animated explainer short: word-timed SVG scenes, themeable styles, captions, vertical MP4."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.0", "playwright>=1.40", "numpy", "pyyaml"]

[project.scripts]
wbx = "wbx.cli:main"

[tool.setuptools]
packages = ["wbx"]

[tool.setuptools.dynamic]
version = {attr = "wbx.__version__"}

[tool.setuptools.package-data]
wbx = ["runtime/*", "templates/*"]
