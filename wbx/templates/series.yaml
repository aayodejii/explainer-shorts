# Series settings for wbx. Anything left out uses the defaults in wbx/config.py.
name: {{NAME}}
header: ""                  # small series title on the hook scene; "" keeps frame 0 for the hook itself

canvas: {width: 1080, height: 1920, fps: 30}
captions: true              # most short-video viewers watch muted
caption_top: 1230           # TikTok/Shorts cover roughly the bottom 400 px; keep content above this

style: clean                # clean | collage | sketch | chalk | whiteboard
# fonts: {title: League Spartan, body: Poppins}   # optional: any Google Fonts for kit styles
# style_options: {round: 0}                       # optional: square corners

theme:
  paper: "#FBFAF5"
  ink: "#1F2430"
  blue: "#2563EB"
  red: "#E0412F"
  green: "#16A34A"
  orange: "#E8890C"
  font_display: Caveat
  font_body: Patrick Hand

audio: {loudness: -14, end_pad: 1.5}   # end_pad = silence after the voice for the end card

voice:
  target_wpm: 228
  notes: ""                 # e.g. which voice/settings you record with

script:
  target_words: 100         # ~25-30 s; short videos keep viewers to the end
  closing_line: ""          # spoken last line, e.g. a call to action
  rules:                    # listed in each new script.md
    - The first sentence is the hook, a consequence or surprise said in the first two seconds.

end_card: {line1: "Save this", line2: "& share it", line3: ""}
